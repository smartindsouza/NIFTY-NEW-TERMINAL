<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Smooth rounded square background (squircle) -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#glowGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
  
  <!-- Outer technological glowing ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="16 12" opacity="0.4" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.2" />

  <!-- Quant Terminal Active Logo/Glyph (Activity line & Tech bolts) -->
  <g filter="url(#shadow)">
    <!-- Tech diamond frame -->
    <path d="M 256,110 L 402,256 L 256,402 L 110,256 Z" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linejoin="round" opacity="0.6"/>
    
    <!-- Active signal wave -->
    <path d="M 160,256 L 210,256 L 235,180 L 277,332 L 302,230 L 322,256 L 352,256" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Glowing core points -->
  <circle cx="256" cy="256" r="6" fill="#10b981"/>
  <circle cx="235" cy="180" r="4" fill="#06b6d4"/>
  <circle cx="277" cy="332" r="4" fill="#3b82f6"/>
</svg>
